name: Experimental release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  check:
    uses: ./.github/workflows/check.yml
  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify the release version and channel
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            if (process.env.RELEASE_TAG !== "v" + pkg.version || pkg.preview !== true) {
              throw new Error("Release tag must match the experimental package version.");
            }
          '
      - run: npm run package
      - name: Create checksums
        run: sha256sum teams-companion-*.vsix > SHA256SUMS
      - name: Publish the experimental VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" teams-companion-*.vsix SHA256SUMS \
            --verify-tag --prerelease --latest=false \
            --title "Teams Companion $RELEASE_TAG (Experimental)" \
            --notes-file .github/experimental-release-notes.md
